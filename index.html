<!DOCTYPE html>
<html>
<head>
    <title>Janzen Vlogs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #111;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        section {
            padding: 30px;
        }

        .video-box {
            background: white;
            padding: 15px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        footer {
            background-color: #111;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Janzen Vlogs</h1>
    <p>My Life • My Journey • My Story</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Vlogs</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section>
    <h2>Latest Vlogs</h2>

    <div class="video-box">
        <h3>My First Vlog</h3>
        <video width="100%" controls>
            <source src="video1.mp4" type="video/mp4">
        </video>
        <p>This is my first vlog experience!</p>
    </div>

    <div class="video-box">
        <h3>School Day Vlog</h3>
        <video width="100%" controls>
            <source src="video2.mp4" type="video/mp4">
        </video>
        <p>A day in my school life.</p>
    </div>

</section>

<footer>
    <p>© 2026 Janzen Vlogs</p>
</footer>

</body>
</html>
